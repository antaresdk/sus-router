name: release
# Publishes a GitHub Release for every v* tag that is newer than the current "Latest" release,
# using the matching `## [X.Y.Z]` section of CHANGELOG.md (read from the tagged commit) as notes.
# Idempotent: tags that already have a Release are skipped, and tags older than "Latest" are
# never touched. Runs on tag pushes, on pushes to main (catches tags pushed before this file
# existed), and by hand.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # GitHub only: the gitea mirror may run the same workflow files, and `gh` targets GitHub.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet

          tags=$(git tag -l 'v*' | sort -V)
          [ -n "$tags" ] || { echo "No v* tags."; exit 0; }
          newest=$(printf '%s\n' "$tags" | tail -n 1)
          latest=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          echo "Latest release: ${latest:-<none>}; newest tag: $newest"

          for tag in $tags; do
            if [ -n "$latest" ]; then
              # Skip tags that are not strictly newer than the current Latest release.
              top=$(printf '%s\n%s\n' "$tag" "$latest" | sort -V | tail -n 1)
              if [ "$tag" = "$latest" ] || [ "$top" = "$latest" ]; then
                continue
              fi
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag: release exists, skipped."
              continue
            fi

            version="${tag#v}"
            git show "$tag:CHANGELOG.md" 2>/dev/null \
              | awk -v h="## [$version]" 'index($0, h) == 1 { f = 1; next } f && /^## / { exit } f { print }' \
              > notes.md || true
            if ! grep -q '[^[:space:]]' notes.md; then
              echo "See CHANGELOG.md for $tag." > notes.md
            fi

            if [ "$tag" = "$newest" ]; then latest_flag="--latest"; else latest_flag="--latest=false"; fi
            gh release create "$tag" --verify-tag --title "$tag" --notes-file notes.md "$latest_flag"
            echo "$tag: release created."
          done
