name: tests
# Unity Test Runner for sus-router via GameCI.
# router depends on core, so the host project pulls core as a git dependency
# (core is public on GitHub). See planning/CI-SETUP.md for the rest.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pkg
          lfs: true
      - name: Scaffold host project
        run: |
          mkdir -p HostProject/Packages HostProject/ProjectSettings HostProject/Assets
          echo 'm_EditorVersion: 6000.3.17f1' > HostProject/ProjectSettings/ProjectVersion.txt
          cat > HostProject/Packages/manifest.json <<'JSON'
          {
            "dependencies": {
              "com.sharq-it.sus.router": "file:../../pkg",
              "com.sharq-it.sus.core": "https://github.com/antaresdk/sus-core.git#v1.0.8",
              "com.unity.test-framework": "1.4.5"
            },
            "testables": ["com.sharq-it.sus.router"]
          }
          JSON
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: HostProject
          unityVersion: 6000.3.17f1
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts
